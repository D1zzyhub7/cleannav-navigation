# CleanNav RTAB-Map LiDAR 2D 建图参数
# 格式：RTAB-Map INI 配置文件
# 来源标注：
#   [ROS1]  ROS1 参考工程 rtabmap_slam.launch
#   [WIP]   待实机验证
#
# 注意：同一参数不在此文件和 launch args 中重复设置

[Core]

# --- 地图输出 ---

# 地图分辨率（米/像素）
# [ROS1] 与 slam_toolbox 一致
Grid/CellSize=0.05

# 障碍物检测最大范围（米）
# [ROS1] Waffle LiDAR 实际有效范围 3.5m
Grid/RangeMax=3.5

# 是否从深度图生成栅格
# [ROS1] 纯 LiDAR 模式，不从深度图生成
Grid/FromDepth=false

# 是否启用光线追踪填充（填充扫描光束路径中的自由空间）
# [ROS1]
Grid/RayTracing=true

# --- 配准 ---

# 仅约束平面 3 自由度（x, y, yaw）
# [ROS1] 差速驱动底盘
Reg/Force3DoF=true

# 配准策略（1=ICP，默认）
# [DEFAULT]
Reg/Strategy=1
