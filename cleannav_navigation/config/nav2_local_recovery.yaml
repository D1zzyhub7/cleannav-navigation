      campus_keepout_inflation:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.7
        cost_scaling_factor: 3.0
      campus_unknown:
        plugin: cleannav_simulation::CampusUnknownLayer
        enabled: true
        map_topic: /cleannav/localization/map
        boundary_cells: 1
      navigation_boundary:
        plugin: cleannav_navigation::NavigationBoundaryLayer
        enabled: true
        minimum_clearance_m: 0.0
