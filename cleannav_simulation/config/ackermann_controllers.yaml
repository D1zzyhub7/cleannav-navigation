controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_controller:
  ros__parameters:
    # SIMULATION_PLACEHOLDER — replace after real chassis measurement.
    # 必须与 cleannav_ackermann.urdf.xacro 顶部同名属性同步修改。
    front_wheel_track: 0.48
    rear_wheel_track: 0.48
    wheelbase: 0.60
    front_wheels_radius: 0.10
    rear_wheels_radius: 0.10

    front_steering: true
    front_wheels_names:
      - front_left_steering_joint
      - front_right_steering_joint
    rear_wheels_names:
      - rear_left_wheel_joint
      - rear_right_wheel_joint

    use_stamped_vel: false
    reference_timeout: 0.5
    open_loop: false
    position_feedback: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    velocity_rolling_window_size: 10
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
