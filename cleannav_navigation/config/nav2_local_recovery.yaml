bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    current_goal_checker: general_goal_checker
    goal_checker_plugins:
    - general_goal_checker
    - patrol_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.35
    patrol_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: cleannav_navigation::BoundedMPPIController
      time_steps: 50
      model_dt: 0.1
      batch_size: 750
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.16
      vx_max: 0.3
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.26785714285714285
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.5
      transform_tolerance: 0.2
      regenerate_noises: false
      motion_model: Ackermann
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      AckermannConstraints:
        min_turning_r: 1.12
        project_samples: true
        path_guided_sample: true
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      - CurvatureSpeedCritic
      CostCritic:
        consider_footprint: true
      PathAlignCritic:
        cost_weight: 14.0
        use_path_orientations: true
        threshold_to_consider: 0.15
        offset_from_furthest: 4
      PathAngleCritic:
        forward_preference: false
      PathFollowCritic:
        threshold_to_consider: 0.15
      GoalAngleCritic:
        threshold_to_consider: 1.4
      CurvatureSpeedCritic:
        cost_weight: 5.0
        max_lateral_accel: 0.03760555233740373
        deceleration: 0.25
        curvature_span: 0.1
      curvature_lookahead_distance: 2.5
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: '[[-0.55, -0.34], [-0.55, 0.34], [0.55, 0.34], [0.55, -0.34]]'
      plugins:
      - static_layer
      - obstacle_layer
      - voxel_layer
      - inflation_layer
      - navigation_boundary
      - campus_unknown
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.5
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /mapping/scan_fused
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /mapping/scan_fused
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /cleannav/localization/map
        map_subscribe_transient_local: true
        footprint_clearing_enabled: false
      always_send_full_costmap: true
      track_unknown_space: true
      filters:
      - campus_keepout
      - campus_keepout_inflation
      campus_keepout:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /campus/costmap_filter_info
